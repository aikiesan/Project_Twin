name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python 3.11 --extra dev --extra geo --extra stats   # 3.12 resolves arviz 1.x (DataTree), which capex_hier does not support yet
      - run: uv run ruff check src tests
      - run: uv run black --check src tests
      - run: uv run python -m engine.registry validate
      - run: uv run pytest
