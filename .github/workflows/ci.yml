# NOTE: GitHub only runs workflows from the repository root. This file becomes active
# once this folder is moved to its own repository (see ACCESS_AT_HOME.md).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra geo --extra stats
      - run: uv run ruff check src tests
      - run: uv run black --check src tests
      - run: uv run python -m engine.registry validate
      - run: uv run pytest
