# Local stack: PostGIS (port 5433, so it does not clash with a local PILAR-2b DB) + Jupyter/engine.
# Usage:  cp .env.example .env  &&  docker compose up -d
# Fixed project name: the pgdata volume stays "sp-biomethane-engine_pgdata" whatever the checkout folder is called.
name: sp-biomethane-engine
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: engine
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${PGPASSWORD:-change-me}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 10s
      retries: 10
  jupyter:
    build: .
    command: >
      uv run --extra nb --extra geo --extra stats
      jupyter lab --ip=0.0.0.0 --no-browser --ServerApp.token='' --ServerApp.root_dir=/work
    ports: ["8888:8888"]
    environment:
      DATABASE_URL: postgresql://engine:${PGPASSWORD:-change-me}@db:5432/engine
    volumes: [".:/work"]
    working_dir: /work
    depends_on:
      db: { condition: service_healthy }
  # Project viewer (docs/26): builds exports/viewer/ from the read-only repo + data/ and serves it.
  # Bound to 127.0.0.1 only: the default build includes data/private layers (CLAUDE.md rule 6).
  viewer:
    build: .
    command: >
      /opt/venv/bin/python -m engine.viz --serve --host 0.0.0.0 --port 8765 --no-prs
    ports: ["127.0.0.1:8765:8765"]
    environment:
      DATABASE_URL: postgresql://engine:${PGPASSWORD:-change-me}@db:5432/engine
      PYTHONDONTWRITEBYTECODE: "1"
      # the bind-mounted checkout is owned by another user; let git read it
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
    volumes:
      - .:/work:ro
      - ./data:/work/data:ro
      - ./exports/viewer:/work/exports/viewer
    working_dir: /work
    depends_on:
      db: { condition: service_healthy, required: false }
volumes:
  pgdata: {}
