# DVC pipeline skeleton — one stage per transform (CLAUDE.md §3).
# Stages are added as data arrive; commands must exist and be deterministic.
# Run:  dvc repro <stage>     (dvc is installed on the home machine, not in CI)
vars:
  # Collection 10 ends in 2024 (ADR-0011 clips); add 2025 with Collection 11.
  - years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016,
            2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

stages:
  inventory_raw:
    cmd: python -m engine.ingest.inventory data/raw --out data/interim/inventory_raw.csv
      --yaml data/interim/inventory_raw_stubs.yaml --folders-out data/interim/inventory_raw_folders.csv
      --private-substr partner --private-substr nda
    deps:
      - data/raw
      - src/engine/ingest/inventory.py
    outs:
      - data/interim/inventory_raw.csv
      - data/interim/inventory_raw_stubs.yaml
      - data/interim/inventory_raw_folders.csv

  # MapBiomas sugarcane area per H3 res-8 cell, one output per year.
  # Legend code(s) come from params.yaml (mapbiomas.cane_code_args); see the citation there.
  cane_area_h3:
    foreach: ${years}
    do:
      cmd: python -m engine.supply.raster_h3 data/raw/mapbiomas_col10_coverage_sp/mapbiomas_sp_${item}.tif
        --year ${item} --res 8 ${mapbiomas.cane_code_args}
        --out data/interim/cane_area_h3/cane_area_h3_${item}.parquet
      deps:
        - data/raw/mapbiomas_col10_coverage_sp/mapbiomas_sp_${item}.tif
        - src/engine/supply/raster_h3.py
      params:
        - mapbiomas.cane_code_args
      outs:
        - data/interim/cane_area_h3/cane_area_h3_${item}.parquet

  # NOT RUNNABLE YET: engine.ingest.renovabio_batch is still to be written (single-report
  # extraction already works: python -m engine.ingest.renovabio <txt> --source-id .. --url ..).
  renovabio_extract:
    cmd: python -m engine.ingest.renovabio_batch data/raw/renovabio
      --out data/interim/renovabio_mill_year.jsonl
    deps:
      - data/raw/renovabio
      - src/engine/ingest/renovabio.py
    outs:
      - data/interim/renovabio_mill_year.jsonl
