# Datasets already on the project PC, copied into data/raw/<id>/ by
#   uv run python -m engine.ingest.local_import scripts/ingest/local_holdings.yaml [--dry-run]
# Chosen from the 2026-10-04 survey of local folders (docs/25_LOCAL_HOLDINGS_SURVEY.md).
# Only public or CP2B-own data is listed here. Personal data (LGPD), partner/NDA material and
# HARVEX/JOEL material is not (discarded by the team, 2026-10-04); the deny list refuses it.
# Every id must have a registry/sources.yaml entry before code reads it (CLAUDE.md rule 3).
# Roots can be overridden with env LOCAL_ROOT_<NAME>, e.g. LOCAL_ROOT_DOWNLOADS=D:/dl.

roots:
  downloads: C:/Users/Lucas/Downloads
  a: A:/
  docs: C:/Users/Lucas/Documents

sources:
  # --- CP2B's own published dataset (CC BY 4.0, DOI 10.25824/redu/F36WP9) ---------------
  - id: cp2b_redu_v2
    root: downloads
    base: 07_DADOS_GIS_BASE/dataverse_files
    include:
      - 01_DATABASE-1/01_DATABASE/*
      - 03_SUPPLEMENTARY-1/03_SUPPLEMENTARY/*
      - 04_METADATA-1/04_METADATA/*
      - data_dictionary.csv
      - README-1.md
      - CITATION-1.txt
      - MANIFEST.TXT

  # --- supply: sugar-energy mills ------------------------------------------------------------
  - id: anp_mapa_ethanol_biodiesel_plants
    root: downloads
    base: 06_DADOS_ENERGIA_EPE
    include: ["Plantas de etanol.csv", "Plantas de biodiesel.csv"]
  - id: conab_mills_2025
    root: downloads
    base: 02_ABIOVE_ILUC/Dados_Projeto_ABIOVE_2026-20260510T113404Z-3-001/Dados_Projeto_ABIOVE_2026/Dados_CONAB
    include: [UNIDADE_PRODUCAO_ETANOL_ACUCAR_BR_ATIVAS_2025.zip]
  - id: conab_cane_series_costs
    root: downloads
    base: 02_ABIOVE_ILUC/Dados_Projeto_ABIOVE_2026-20260510T113404Z-3-001/Dados_Projeto_ABIOVE_2026/Dados_CONAB
    include: [SerieHistoricaCana.txt, LevantamentoCana.txt, CustoProducao.txt]

  # --- market: ANP biomethane open data (newer than the PILAR-2b copy) ------------------------
  - id: anp_biomethane_open_data_2026_04
    root: downloads
    base: 06_DADOS_ENERGIA_EPE/biometano-dados-abertos
    include: ["*.csv"]

  # --- supply: sewage, population --------------------------------------------------------------
  - id: cetesb_ictem_2023
    root: downloads
    base: 06_DADOS_ENERGIA_EPE/Mapeamento EPE/Recursos Energeticos
    include: [VWM_ICTEM_CETESB_2023_POL.zip]
  - id: ibge_censo_2022_pop_sp
    root: a
    base: CP2B_Maps
    include: ["Censo 2022 - Território - São Paulo.csv"]

  # --- siting: exclusions, grid areas, rail (GeoSEADE) -----------------------------------------
  - id: seade_geo_ambiente_transporte
    root: downloads
    base: 06_DADOS_ENERGIA_EPE/Mapeamento EPE/SEADE/Infraestrutura e meio ambiente
    include:
      - metadados_geoseade_infraestrutura_e_meio_ambiente.xlsx
      - ambiente_unid_conservacao_*.zip
      - ambiente_terras_indigenas.zip
      - ambiente_assentamentos_incra.zip
      - ambiente_ugrhi.zip
      - energia_distribuidoras.zip
      - transporte_ferrovias.zip
      - transporte_ferrovia_estacao.zip
      - transporte_porto_seco.zip

  # --- supply: pasture degradation (land for energy crops) -------------------------------------
  - id: lapig_pasture_vigor_col9
    root: a
    base: ILUC_NIPE/ILUC_NIPE/03_Pasture_Vigor_LAPIG
    include: ["brasil_pasture_vigor_col9_s100_year=*.csv"]

  # --- land use: ABIOVE ILUC work, public-source area series per SP intermediate region --------
  # Team decision 2026-10-04: the MapBiomas-based ABIOVE tables are reusable; the HARVEX-branded
  # transition matrices (03_Matrizes_Transicao_FINAL) and any HARVEX/JOEL indicator are not.
  - id: abiove_lulc_area_series_sp_rgint
    root: a
    base: ILUC_NIPE/ENTREGA_PRODUTO_P1-20260621T122008Z-3-001/ENTREGA_PRODUTO_P1/01_Bases_de_dados_multifontes
    include:
      - "*_35??_classes_multifonte.xlsx"

  # ===== Second survey (2026-10-05): folders under C:/Users/Lucas/Documents (docs/25 §5) =====
  # --- costs/market: FIESP-led SP biomethane study, June 2025 (copy with a text layer) -------
  - id: fiesp_sp_biomethane_2024
    root: docs
    base: 40_Pesquisa_Dados_e_Referencias/REFERENCIAS_PILAR2B/Organized_Papers
    include: [O-Biometano-em-Sao-Paulo_Potencial-e-Medidas-para-alavancar-a-producao_2025.pdf]
  - id: epe_panorama_biometano_2023
    root: docs
    base: Reposicionamento_Submissão_ESD/Benchmarks_Brasil
    include: [Panorama de Biometano.pdf]
  - id: abiogas_mapeamento_biometano_2032
    root: docs
    base: 40_Pesquisa_Dados_e_Referencias/REFERENCIAS_PILAR2B/Organized_Papers
    include: [ABiogas-Nota_tecnica_MAPEAMENTO_DE_PLANTAS_DE_BIOMETANO_ATE_2032.pdf]

  # --- supply: sanitation and municipal solid waste --------------------------------------------
  - id: sinisa
    root: docs
    base: Reposicionamento_Submissão_ESD/00_Primary_Data_Sources_PILAR2b/03_SNIS_Series
    include: ["*_SNIS_ConsolidadoMunicipio-*.csv", SNIS_ConsolidadoMunicipio_LATEST.csv]
  - id: cetesb_datageo_waste_indices
    root: docs
    base: Reposicionamento_Submissão_ESD/DADOS_ESPACIAIS
    include:
      - "VWM_IQR_CETESB_202?_POL/*"
      - "IGR202?/*"
      - "VWM_IQC_CETESB_202?_POL/*"
      - IQR_READ_ME.txt
      - IGR_READ_ME.txt
      - IQC_READ_ME.txt
  - id: cetesb_ictem_2024
    root: docs
    base: Reposicionamento_Submissão_ESD/DADOS_ESPACIAIS
    include:
      - "VWM_ICTEM_CETESB_2024_POL/*"
      - "ICTEM - Indicador de Coleta e Tratabilidade de Esgoto da População Urbana de Município em 2024.txt"

  # --- supply: livestock herds (SIDRA) -----------------------------------------------------------
  - id: ibge_ppm
    root: docs
    base: Reposicionamento_Submissão_ESD/00_Primary_Data_Sources_PILAR2b
    include:
      - 04_IBGE_Tabelas/TABELA_3939_PPM_2008A2024.xlsx
      - 04_IBGE_Tabelas/TABELA_74_2008A2024.xlsx
      - 04_IBGE_Tabelas/TABELA_3940_2008A2024.xlsx
      - TABELA_94_VACAS_ORDENHADAS_PPM_2008_A2024.xlsx

  # --- spatial: federal roads, EPE WebMap layers ------------------------------------------------
  - id: dnit_snv
    root: docs
    base: CP2B/DNIT_MULTIMODAL/DNIT_Multimodal-20250821T171558Z-1-001/DNIT_Multimodal
    include:
      - "SNV_Bases_Geometricas_SHP/*"
      - SNV_Planilhas_XLS/SNV_202507A.xls
      - "SNV_Publicacoes_2025/03_Dados/Guia SNV_202507A.pdf"
  - id: epe_webmap
    root: docs
    base: .
    include: ["Mapa_Poster_*/Dados_Webmap_EPE/*/zipfolder/*"]

  # --- calibration: CP2B potential v5.1 and the plant validation audit -------------------------
  - id: cp2b_method_v5_1
    root: docs
    base: Reposicionamento_Submissão_ESD
    include:
      - "Metodo_CP2b/outputs_v5/*.csv"
      - "Metodo_CP2b/outputs_v5/*.json"
      - "Submissão ESD + Data in Brief/Pacote_CP2b_v5.1/LEIA-ME.md"
      - "Submissão ESD + Data in Brief/Pacote_CP2b_v5.1/tabelas/*"
  - id: cp2b_plant_validation_audit_2026_09
    root: docs
    base: CP2B/VALIDACAO_DE_USINAS_BIOGAS/auditoria_camada_validacao_20260916
    include: ["*"]

  # --- supply: industrial points of interest from public RAIS (pending validation) -------------
  # The legacy Industrias_SP_pontos layer is blocked by this same audit (CNAE 01113 read as 11135).
  - id: rais_industrial_coordinates_sp_2026_09
    root: docs
    base: Reposicionamento_Submissão_ESD/DADOS_ESPACIAIS
    include:
      - README.md
      - README2.md
      - catalogo_dados.csv
      - problemas_qualidade.csv
      - fontes_prioritarias.csv
      - modelo_dados_pilar2b.md
      - "coordenadas_*.csv"
      - "dados_staging/*.csv"

  # --- economy-wide: input-output matrix, energy balance ----------------------------------------
  - id: ibge_io_matrix_2015
    root: docs
    base: Input_Output_Ideas
    include: [Matriz_de_Insumo_Produto_2015_Nivel_67.xls]
  - id: epe_ben_2025
    root: docs
    base: 40_Pesquisa_Dados_e_Referencias/Balanco_Energetico_BEN/_arquivos_da_raiz
    include: ["Anexo IX - *.xlsx", "Anexo X - *.xlsx", "Matriz ab2024.xlsx"]

  # --- verification sources --------------------------------------------------------------------
  - id: atlas_bioenergia_sp_2020
    root: docs
    base: 40_Pesquisa_Dados_e_Referencias/Atlas_Bioenergia/PDFs_e_Figuras_Paper
    include: [Atlas_Bioenergia_SP_2020_livro_DIGITAL_FinalV2_compressed.pdf]
  - id: intl_de_dbfz_resources
    root: docs
    base: .
    include:
      - 40_Pesquisa_Dados_e_Referencias/REFERENCIAS_PILAR2B/Organized_Papers/DBFZ_BiomassMonitor_01122024_v6.3.csv
      - Reposicionamento_Submissão_ESD/DBFZ_REFERENCES/BIOMASSEPOTENZIALE_BASISDATEN.xlsx
      - Reposicionamento_Submissão_ESD/DBFZ_REFERENCES/BIOMASSEPOTENZIALE_BASISDATEN_readme.xlsx
      - Reposicionamento_Submissão_ESD/DBFZ_REFERENCES/Metadata_Nutzungshinweise.pdf
      - Reposicionamento_Submissão_ESD/DBFZ_REFERENCES/Data_regional_DE.csv
